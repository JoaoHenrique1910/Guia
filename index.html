<html lang="pt-BR">

<head>
   <link rel="stylesheet" href="style.css">
   <title>Guia de Bolso Git</title>
</head>

<body>
   <header>
      <h1>Guia de Bolso</h1>
   </header>
   <main>
      <h2>Comandos Essenciais</h2>

      <h3>git init</h3>
      <p>Cria um novo repositório Git</p>

      <h3>git add .</h3>
      <p>Salva todas as alterações</p>

      <h3>git commit -m "[Mensagem de Commit]"</h3>
      <p>Salva minhas alterações no histórico local</p>
   </main>
   <footer>
      <hr>
      <p>Dicas: Lembre-se de sempre dar Ctrl + S antes de fechar o projeto</p>
   </footer>
</body>

</html>
